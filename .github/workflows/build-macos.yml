name: Build macOS App

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Build macOS app
        run: |
          python -m PyInstaller \
            --noconfirm \
            --clean \
            --windowed \
            --name HumanTypist \
            human_typist.py

      - name: Create ZIP
        run: |
          cd dist
          zip -r HumanTypist-macOS.zip HumanTypist.app

      - name: Upload macOS app
        uses: actions/upload-artifact@v4
        with:
          name: HumanTypist-macOS
          path: dist/HumanTypist-macOS.zip
